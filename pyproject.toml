[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscan"
version = "0.1.0"
description = "Elite stock scan/research model — a two-stage funnel that pairs a quantitative screen with the A+ Assessment pressure-test engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "21pphua" }]
keywords = ["investing", "stock-screener", "research", "trading-strategy"]

# Core engine (assessment math + CLI) has ZERO required deps — runs offline.
dependencies = []

[project.optional-dependencies]
# Stage-1 quantitative screen needs live market data.
data = ["yfinance>=0.2.40", "pandas>=2.0", "numpy>=1.24"]
# LLM-drafted CORE subscores (the research step).
research = ["anthropic>=0.40"]
# Everything.
all = ["yfinance>=0.2.40", "pandas>=2.0", "numpy>=1.24", "anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
stockscan = "stockscan.cli:main"

[tool.setuptools.packages.find]
include = ["stockscan*"]

[tool.setuptools.package-data]
stockscan = ["universes/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
