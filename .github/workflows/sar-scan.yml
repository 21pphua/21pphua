name: SAR nightly scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays, after the US market close
  workflow_dispatch:           # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up git
        run: |
          git config user.name "sar-bot"
          git config user.email "sar-bot@users.noreply.github.com"
      - name: Put uploaded files in the right folders (one-time)
        run: |
          if [ -f engine.py ]; then
            mkdir -p stockscan/sar
            git mv -f __init__.py stockscan/sar/__init__.py
            git mv -f engine.py stockscan/sar/engine.py
            git mv -f scan.py stockscan/sar/scan.py
            git mv -f render.py stockscan/sar/render.py
            git mv -f cli.py stockscan/cli.py
            git mv -f config.py stockscan/config.py
            git mv -f build_us_universe.py scripts/build_us_universe.py
            git mv -f test_sar.py tests/test_sar.py
            if [ -f sar-scan.yml ]; then git rm -q sar-scan.yml; fi
            git commit -m "Move SAR scanner files into place"
            git push
          fi
      - run: pip install -e '.[data]'
      - run: python scripts/build_us_universe.py
      - name: Run the SAR scan
        run: |
          mkdir -p results
          stockscan sar --out results/shortlist.json > results/latest.txt
          cp results/latest.txt "results/scan-$(date -u +%Y-%m-%d).txt"
      - name: Save results
        run: |
          git add results
          git commit -m "SAR scan $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
