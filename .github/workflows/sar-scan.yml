name: SAR nightly scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays, after the US market close
  workflow_dispatch:           # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[data]'
      - run: python scripts/build_us_universe.py
      - run: |
          mkdir -p results
          stockscan sar --out results/shortlist.json > results/latest.txt
          cp results/latest.txt "results/scan-$(date -u +%Y-%m-%d).txt"
      - run: |
          git config user.name "sar-bot"
          git config user.email "sar-bot@users.noreply.github.com"
          git add results
          git commit -m "SAR scan $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
